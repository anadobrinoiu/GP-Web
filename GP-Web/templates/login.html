<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The GP Clinic</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .form-wrapper {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
        }

        .login-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;

            text-align: center;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
            font-size: 0.95rem;
        }

        .form-control {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #0095f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #007cd6;
        }

        a {
            color: #007cd6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: red;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

        <!-- Home Button -->
        <div class="text-start ms-3 mt-3">
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Home</a>
        </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="form-wrapper mb-3">
                    <h2 class="text-center mb-4">Login</h2>
                    <form id="loginForm" method="POST" action="/login">
                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                        <div id="error" class="error-msg text-center"></div>
                    </form>
                </div>

                <div class="login-box">
                    <p class="mb-1">Don't have an account?</p>
                    <a href="{{ url_for('register') }}">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to handle login -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await res.json();

                if (res.ok) {
                    window.location.href = "/appointments";
                } else {
                    document.getElementById("error").textContent = result.error || "Login failed.";
                }

            } catch (error) {
                document.getElementById("error").textContent = "Something went wrong. Please try again.";
                console.error(error);
            }
        });
    </script>

</body>
</html>
