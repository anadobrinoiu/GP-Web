<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - The GP Clinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container admin-container">
        <h2 class="text-center">Admin Panel</h2>
        <p>View and manage appointments here.</p>
        
        <table class="table">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Doctor</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John Doe</td>
                    <td>12/05/2025</td>
                    <td>10:30 AM</td>
                    <td>Dr. Smith</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
