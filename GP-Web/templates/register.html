<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The GP Clinic</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .form-wrapper {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 10px;
            width: 100%;
        }

        .login-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
            font-size: 0.95rem;
            width: 100%;
        }

        .form-control {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #0095f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #007cd6;
        }

        a {
            color: #007cd6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .legal-text {
            font-size: 0.75rem;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>
<body>


        <div class="text-start ms-3 mt-3">
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Home</a>
        </div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="form-wrapper">
                    <h2 class="text-center mb-4">Register</h2>
                    <form id="registerForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-control" id="role" name="role" required>
                                <option value="" disabled selected>Select Role</option>
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                        <div class="legal-text text-center">
                            By registering, you agree to our <a href="#">Terms</a>, <a href="#">Privacy</a>, and <a href="#">Cookies Policy</a>.
                        </div>
                    </form>
                </div>
    
                <div class="login-box mt-3">
                    <p class="mb-1">Have an account?</p>
                    <a href="{{ url_for('login') }}">Log in</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to handle registration -->
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value
            };

            try {
                const res = await fetch("/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                const result = await res.json();
                alert(result.message || result.error);

                if (res.ok) {
                    window.location.href = "/login";
                }

            } catch (error) {
                alert("Something went wrong. Please try again.");
                console.error(error);
            }
        });
    </script>

</body>
</html>
